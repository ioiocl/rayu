services:
  nginx:
    image: nginx:alpine
    container_name: rayu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rayu-app
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rayu_neo4j_password
      DATABASE_URL: postgresql://postgres:postgres1@host.docker.internal:5432/rayu
      SESSION_SECRET: rayu-production-secret-change-this-in-production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22
    container_name: rayu-neo4j
    environment:
      NEO4J_AUTH: neo4j/rayu_neo4j_password
      NEO4J_server_config_strict__validation_enabled: "false"
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p rayu_neo4j_password 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
