<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayu - Lectura de Historia</title>
    <link rel="stylesheet" href="story.css" />
  </head>
  <body>
    <header class="story-header">
      <img src="img/logo_RAYU.png" alt="Rayu" class="logo" />
      <a class="back-link" href="/">← Volver al inicio</a>
      <div>
        <p class="eyebrow">Lectura en árbol</p>
        <h1 id="storyTitle">Historia</h1>
        <p id="storyMeta" class="story-meta">Cargando...</p>
      </div>
      <div id="userSection" class="user-section hidden">
        <div class="user-icon" id="userIcon">
          <div class="user-avatar">👤</div>
          <span id="userNickname" class="user-nickname"></span>
          <span id="notificationBadge" class="notification-badge hidden">0</span>
        </div>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button id="loginBtn" class="btn-secondary" type="button">Iniciar sesión</button>
        <button id="signupBtn" class="btn-primary" type="button">Registrarse</button>
      </div>
    </header>

    <main class="story-main">
      <section id="emptyState" class="empty-state hidden">
        No se encontraron capítulos para esta historia.
      </section>

      <section id="graphBoard" class="graph-board hidden">
        <div id="zoomWrapper" class="zoom-wrapper">
          <svg id="edgesLayer" class="edges-layer" aria-hidden="true"></svg>
          <div id="nodesLayer" class="nodes-layer"></div>
        </div>
      </section>
    </main>

    <div class="fab-zoom-group" aria-label="Controles de zoom">
      <button id="zoomIn" class="fab-zoom" type="button" aria-label="Acercar">+</button>
      <button id="zoomOut" class="fab-zoom" type="button" aria-label="Alejar">−</button>
    </div>

    <button id="viewStoryButton" class="fab-view-story hidden" type="button" aria-label="Ver historia">
      📖
    </button>

    <button id="openChapterModal" class="fab-create" type="button" aria-label="Agregar capítulo">
      + Capítulo
    </button>

    <div id="storyViewerModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="storyViewerTitle">
      <section class="modal-card modal-story-viewer">
        <div class="modal-header">
          <h2 id="storyViewerTitle">Historia seleccionada</h2>
          <button id="closeStoryViewer" class="modal-close" type="button" aria-label="Cerrar">×</button>
        </div>
        <div id="storyViewerContent" class="story-viewer-content"></div>
      </section>
    </div>

    <div id="chapterModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="chapterModalTitle">
      <section class="modal-card">
        <div class="modal-header">
          <h2 id="chapterModalTitle">Continuar historia</h2>
          <button id="closeChapterModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        </div>

        <form id="chapterForm" class="chapter-form">
          <input id="chapterUsername" placeholder="Tu usuario" required />

          <label for="chapterParent">Continuar desde nodo</label>
          <select id="chapterParent" required></select>

          <label for="chapterType">Tipo de contenido</label>
          <select id="chapterType" required>
            <option value="text">Texto</option>
            <option value="image">Imagen</option>
            <option value="audio">Audio</option>
            <option value="video">Video</option>
          </select>

          <div id="chapterTextInput" class="media-input">
            <textarea id="chapterContentText" rows="4" placeholder="Escribe el nuevo capítulo" required></textarea>
          </div>

          <div id="chapterImageInput" class="media-input hidden">
            <div class="media-options">
              <button type="button" id="chapterCaptureImage" class="btn-secondary">📸 Capturar foto</button>
              <button type="button" id="chapterUploadImage" class="btn-secondary">📁 Subir imagen</button>
              <button type="button" id="chapterUrlImage" class="btn-secondary">🔗 URL</button>
            </div>
            <div id="chapterImagePreview" class="media-preview"></div>
            <input id="chapterImageUrl" type="url" placeholder="O pega una URL" class="hidden" />
          </div>

          <div id="chapterAudioInput" class="media-input hidden">
            <div class="media-options">
              <button type="button" id="chapterRecordAudio" class="btn-secondary">🎤 Grabar audio (máx 10s)</button>
              <button type="button" id="chapterUrlAudio" class="btn-secondary">🔗 URL</button>
            </div>
            <div id="chapterAudioPreview" class="media-preview"></div>
            <div id="chapterAudioProgress" class="progress-bar hidden"></div>
            <input id="chapterAudioUrl" type="url" placeholder="O pega una URL" class="hidden" />
          </div>

          <div id="chapterVideoInput" class="media-input hidden">
            <div class="media-options">
              <button type="button" id="chapterRecordVideo" class="btn-secondary">🎥 Grabar video (máx 10s)</button>
              <button type="button" id="chapterUrlVideo" class="btn-secondary">🔗 URL</button>
            </div>
            <div id="chapterVideoPreview" class="media-preview"></div>
            <div id="chapterVideoProgress" class="progress-bar hidden"></div>
            <input id="chapterVideoUrl" type="url" placeholder="O pega una URL" class="hidden" />
          </div>

          <button type="submit">Agregar capítulo</button>
        </form>
      </section>
    </div>

    <div id="loginModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
      <section class="modal-card">
        <div class="modal-header">
          <h2 id="loginModalTitle">Iniciar sesión</h2>
          <button id="closeLoginModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        </div>
        <form id="loginForm" class="stack">
          <input id="loginEmail" type="email" placeholder="Email" required />
          <input id="loginPassword" type="password" placeholder="Contraseña" required />
          <button type="submit">Iniciar sesión</button>
          <p class="form-footer">¿No tienes cuenta? <a href="#" id="switchToSignup">Regístrate</a></p>
        </form>
      </section>
    </div>

    <div id="signupModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="signupModalTitle">
      <section class="modal-card">
        <div class="modal-header">
          <h2 id="signupModalTitle">Registrarse</h2>
          <button id="closeSignupModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        </div>
        <form id="signupForm" class="stack">
          <input id="signupEmail" type="email" placeholder="Email" required />
          <input id="signupPassword" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" />
          <input id="signupNickname" type="text" placeholder="Nickname (mínimo 3 caracteres)" required minlength="3" />
          <p id="nicknameAvailability" class="nickname-status"></p>
          <button type="submit">Registrarse</button>
          <p class="form-footer">¿Ya tienes cuenta? <a href="#" id="switchToLogin">Inicia sesión</a></p>
        </form>
      </section>
    </div>

    <div id="profileModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <section class="modal-card modal-large">
        <div class="modal-header">
          <h2 id="profileModalTitle">Mi Perfil</h2>
          <button id="closeProfileModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        </div>
        <div class="profile-content">
          <div class="profile-info">
            <div class="user-avatar-large">👤</div>
            <h3 id="profileNickname"></h3>
            <p id="profileEmail"></p>
            <button id="logoutBtn" class="btn-secondary">Cerrar sesión</button>
          </div>
          <div class="profile-tabs">
            <button class="tab-btn active" data-tab="stories">Mis Historias</button>
            <button class="tab-btn" data-tab="chapters">Mis Capítulos</button>
            <button class="tab-btn" data-tab="inbox">Inbox <span id="inboxBadge" class="tab-badge hidden">0</span></button>
          </div>
          <div id="storiesTab" class="tab-content active">
            <div id="userStories" class="user-stories"></div>
          </div>
          <div id="chaptersTab" class="tab-content">
            <div id="userChapters" class="user-chapters"></div>
          </div>
          <div id="inboxTab" class="tab-content">
            <div id="userNotifications" class="user-notifications"></div>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="story-main.js"></script>
  </body>
</html>
